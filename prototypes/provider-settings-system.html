<style>
:root{--bg:#fff;--subtle:#f7f8fa;--hover:#f0f2f5;--ink:#222528;--muted:#666d75;--faint:#707780;--line:#e4e7eb;--accent:#2c333a;--green:#3b7759;--amber:#a56717;--danger:#b34848;--track:#e7e9ec;--dsw-alias-bg-layer-1:#fff;--frame:1040px;--controls-height:50px;--draft-height:0px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--viewport-height:100dvh;--viewport-bottom:0px;color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5;color:var(--ink)}

:root[data-theme=dark]{--bg:#202226;--subtle:#26292e;--hover:#30343a;--ink:#e8eaee;--muted:#aab0b8;--faint:#939aa4;--line:#3b4048;--accent:#d3d8df;--green:#83b69a;--amber:#e5b25e;--danger:#ed9898;--track:#41464e;--dsw-alias-bg-layer-1:#202226;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:#c9cbcd}
:root[data-theme=dark] body{background:#15171b}
:root[data-theme=dark] .prototype-caption{color:#aab0b8}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid #718ca8;outline-offset:3px}
button{border:0;background:none}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
svg{width:16px;height:16px;flex:none}
input,select,textarea{min-width:0;max-width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:34px;outline-offset:1px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;min-height:0;padding:0;flex:none;margin:0}

code{font-size:11px;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.grow{flex:1;min-width:0}
.spacer{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:var(--bg);color:var(--ink);white-space:nowrap;font-size:12px;font-weight:500}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--faint);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn.quiet{background:transparent;border-color:transparent}
.btn.danger,.btn.danger:hover:not(:disabled){color:var(--danger)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;min-height:32px;padding:0;border-radius:8px;flex:none}
.icon-btn:hover{background:var(--hover)}
.link-btn{font-size:12px;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10px;line-height:16px;font-weight:500;white-space:nowrap;color:var(--muted)}

.pill.dev{border-color:color-mix(in srgb,var(--amber) 25%,transparent);color:var(--amber);background:color-mix(in srgb,var(--amber) 5%,transparent)}
.dot{display:inline-block;width:6px;height:6px;flex:none;border-radius:50%;background:var(--faint)}
.dot.good{background:var(--green)}
.dot.warn{background:var(--amber)}
.brand{width:26px;height:28px;display:grid;place-items:center;flex:none}
.brand svg{width:23px;height:23px}
.brand.big{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.brand.big svg{width:24px;height:24px}
.tiny{font-size:11px}
.danger-text{color:var(--danger)}

/* Native Settings chrome: 188px nav, 32px shell radius, existing text / control density. */
.stage{--stage-top:42px;--stage-bottom:calc(var(--controls-height) + 40px + var(--safe-bottom));min-height:var(--viewport-height);padding:var(--stage-top) calc(12px + var(--safe-right)) var(--stage-bottom) calc(12px + var(--safe-left));display:grid;place-items:center}
.prototype-caption{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#4e535a;white-space:normal;text-align:center;max-width:calc(100vw - 24px);width:max-content;letter-spacing:.3px}
.prototype-caption strong{font-size:10px;letter-spacing:1.5px;margin-right:8px}
.settings{display:flex;width:min(var(--frame),calc(100vw - 24px - var(--safe-left) - var(--safe-right)));height:min(840px,calc(var(--viewport-height) - var(--stage-top) - var(--stage-bottom)));min-height:0;overflow:hidden;background:var(--bg);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);border-radius:32px;box-shadow:0 16px 64px #0002,0 2px 8px #0001;container-type:inline-size;container-name:settings}
.nav{width:188px;flex:none;padding:24px 12px;display:flex;flex-direction:column;gap:20px}
.nav-title{font-size:16px;font-weight:500;padding:0 12px}
.nav-list{display:flex;flex-direction:column;gap:4px}
.nav-cell{display:flex;align-items:center;gap:9px;min-height:40px;padding:9px 12px;border-radius:11px;text-align:left;white-space:nowrap;font-size:13px}
.nav-cell:hover{background:var(--subtle)}
.nav-cell.active{background:var(--hover);font-weight:500}
.nav-note{margin-top:auto;padding:12px;font-size:10px;color:var(--faint);line-height:1.8}
.pane{min-width:0;min-height:0;flex:1;display:flex;flex-direction:column}
.shell-top{height:57px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px 8px;flex:none}
.config-button{font-size:11px;border-radius:10px;min-height:28px;padding:3px 10px}
.workspace{flex:1;min-height:0;min-width:0;overflow:auto;padding:0 24px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;container-type:inline-size;container-name:workspace}
.page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:3px 0 24px}
.page-title h1{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.5px}
.page-title p{color:var(--muted);font-size:12px;margin-top:5px}
.page-title .btn{margin-top:2px}
.section-kicker{text-transform:uppercase;font-size:10px;letter-spacing:1.6px;color:var(--faint);font-weight:600;margin-bottom:5px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.section-heading h3{font-size:13px;font-weight:650;letter-spacing:.1px}
.section-heading .count{color:var(--faint);font-weight:400;margin-left:6px}
.alert{padding:10px 12px;border:1px solid var(--line);background:var(--subtle);border-radius:8px;display:flex;gap:9px;font-size:12px;color:var(--muted);line-height:1.7}
.alert.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 22%,var(--line));background:color-mix(in srgb,var(--amber) 4%,var(--bg))}
.alert.error{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 25%,var(--line));background:color-mix(in srgb,var(--danger) 4%,var(--bg))}
.alert svg{margin-top:3px}
.identity{display:flex;align-items:center;gap:12px;min-width:0}
.identity .name{font-size:14px;font-weight:600;overflow-wrap:anywhere;line-height:20px}
.identity .sub{margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--faint);font-size:11px}
.identity .name-line{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.provider-row{border-bottom:1px solid var(--line);scroll-margin-top:12px}
.provider-row:last-child{border-bottom:0}
.provider-head{display:grid;grid-template-columns:minmax(0,1fr) 204px 16px;align-items:center;gap:16px;text-align:left;width:100%;padding:18px 12px;min-height:96px;border-radius:10px;margin:2px 0}
.provider-head:hover{background:var(--subtle)}
.provider-head[aria-expanded=true]{background:var(--subtle)}

.provider-head[aria-expanded=true] .chevron{transform:rotate(90deg)}
.provider-body{padding:20px 12px 24px;display:flex;flex-direction:column;gap:24px;min-width:0}
.provider-intro{font-size:12px;color:var(--muted);line-height:1.75}
.detail-title{padding:0 0 16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.detail-title .identity .name{font-size:18px}
.detail-title .sub{font-size:11px}
.detail-body{padding:16px 0 0}
.account{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--subtle);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.account-name{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.account-meta{font-size:11px;color:var(--muted);margin-top:4px}
.account-actions{display:flex;gap:6px;flex-wrap:wrap}
.api-key-row{display:flex;align-items:end;gap:8px;margin-top:12px}
.api-key-row .field{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field-label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.field-hint{font-size:11px;color:var(--faint);line-height:1.65}
.checkbox-field{display:flex;align-items:center;gap:7px;font-size:12px;min-height:34px}
.field input,.field select{width:100%}
.quota-list{display:grid;grid-template-columns:minmax(0,1fr);gap:17px}
.meter{display:flex;flex-direction:column;gap:6px;min-width:0}
.meter-top{display:flex;align-items:baseline;gap:10px;justify-content:space-between;min-width:0}
.meter-label{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter-value{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550}
.track{height:6px;border-radius:2px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;width:100%;position:relative}
/* Same 10 cells / 1px separators / 2px end marker as ProviderQuotaMeter. */
.track::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1px),var(--dsw-alias-bg-layer-1) calc(10% - 1px),var(--dsw-alias-bg-layer-1) 10%)}
.fill{height:100%;background:color-mix(in srgb,var(--ink) 55%,var(--muted));border-radius:2px;min-width:0;transition:width .2s;position:relative}
.fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--ink)}
.fill.low{background:var(--amber)}
.meter-caption{display:block;font-size:11px;color:var(--faint);line-height:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mini .meter-caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .meter-label{font-size:11px}
.mini .meter-value{font-size:12px}
.missing-quota{display:flex;flex-direction:column;gap:4px;color:var(--faint);font-size:12px;min-height:48px;justify-content:center}
.quota-meta{margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--faint);font-size:10px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:17px 0 0;padding:14px;background:var(--subtle);border-radius:9px}
.facts dt{font-size:10px;color:var(--muted)}
.facts dd{margin:3px 0 0;font-size:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.activity{margin-top:15px;border-top:1px solid var(--line);padding-top:12px}
.activity summary{cursor:pointer;font-size:12px;color:var(--muted)}
.activity-list{margin-top:8px;font-size:12px;display:grid;gap:7px}
.model-list{display:flex;flex-direction:column;gap:10px}
.model-card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.model-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) var(--model-action,32px) var(--model-action,32px);gap:8px;align-items:end}
.model-toggle[aria-expanded=true] .chevron{transform:rotate(90deg)}
.model-parameters{display:grid;gap:8px}
.model-parameters[hidden]{display:none}
.model-toolbar{flex-wrap:wrap;justify-content:flex-end}
[data-model-catalog]{scroll-margin-top:8px}
[data-model-catalog]>.section-heading{flex-wrap:wrap}
.model-options{display:grid;grid-template-columns:minmax(85px,1fr) minmax(110px,1fr) minmax(100px,1fr);gap:12px;padding-top:9px;border-top:1px solid var(--line);align-items:end}
.model-options .field-label{font-size:10px}
.model-options input,.model-options select{font-size:11px;min-height:30px;padding:5px 7px}
.model-capabilities{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:30px}
.model-capabilities label{font-size:11px;display:flex;gap:5px;align-items:center}
.model-capabilities input{width:14px;height:14px;min-height:0}
.model-card .model-source{font-size:10px;color:var(--faint);padding-top:1px}
.empty-box{border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;padding:25px 18px;color:var(--muted)}
.empty-box svg{width:22px;height:22px;color:var(--faint);margin-bottom:3px}
.empty-box p{font-size:12px}
.model-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.advanced{border-top:1px solid var(--line);padding-top:17px}
.advanced>summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none;font-size:13px;font-weight:550}
.advanced>summary::-webkit-details-marker{display:none}
.advanced>summary .chevron{width:13px;height:13px}
.advanced[open]>summary .chevron{transform:rotate(90deg)}
.advanced .advanced-note{font-size:11px;color:var(--faint);font-weight:400;margin-left:auto}
.advanced-content{display:flex;flex-direction:column;gap:16px;margin-top:18px;padding:0 1px}
.control{display:flex;flex-direction:column;gap:4px}
.control-child{margin-left:22px;padding-left:14px;border-left:2px solid var(--line)}
.control .field{max-width:100%}
.control .checkbox-field{align-items:flex-start;min-height:0;font-weight:500}
.control .checkbox-field input{margin-top:3px}
.control .field-hint{padding-left:22px}
.control-child .field-hint{padding-left:0}
.provider-foot{color:var(--faint);font-size:10px;display:flex;gap:6px;align-items:center}
.draftbar{border-top:1px solid var(--line);background:var(--subtle);padding:12px 24px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex:none;font-size:12px}
.draftbar:empty{display:none}
.draftbar .actions{display:flex;gap:7px}
.draft-dot{color:var(--amber);font-size:10px}
.skeleton .track{background:linear-gradient(90deg,var(--track),var(--subtle),var(--track));background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{to{background-position:-200% 0}
}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}

/* B changes navigation, not just chrome: persistent provider rail + one detail surface. */
.master-detail{display:grid;grid-template-columns:148px minmax(0,1fr);gap:22px;align-items:start}
.provider-rail{position:sticky;top:0;display:flex;flex-direction:column;gap:4px;padding-right:12px;border-right:1px solid var(--line)}
.rail-item{display:flex;gap:8px;align-items:center;text-align:left;padding:10px 8px;border-radius:9px;min-width:0;width:100%}
.rail-item:hover{background:var(--subtle)}
.rail-item[aria-current=true]{background:var(--hover)}
.rail-item .brand{width:20px}
.rail-item .brand svg{width:18px;height:18px}
.rail-item .rail-name{font-size:12px;font-weight:550;overflow-wrap:anywhere}
.rail-item .rail-status{font-size:10px;color:var(--faint);margin-top:3px}
.rail-label{font-size:10px;letter-spacing:.7px;color:var(--faint);padding:0 8px 8px}
.detail-panel{min-width:0}
.master-detail .provider-body{padding-left:0;padding-right:0}
.master-detail .detail-title .identity{gap:10px}
.master-detail .detail-title .name{font-size:16px}
.master-detail .model-options{gap:8px}

/* C: a cross-provider quota ledger, then a dedicated full-width configuration page. */
.overview-note{padding:14px 16px;background:var(--subtle);border:1px solid var(--line);border-radius:11px;margin-bottom:19px;display:flex;align-items:center;gap:12px}
.overview-note .number{font-size:27px;line-height:1;font-weight:550;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.overview-note p{font-size:11px;color:var(--muted)}
.ledger{display:flex;flex-direction:column}
.ledger-labels,.ledger-row{display:grid;--quota-column:minmax(170px,calc((100% - 90px)/2.05));grid-template-columns:minmax(140px,1fr) var(--quota-column) 50px;gap:20px;align-items:center}
.ledger-labels{padding:0 12px 10px;font-size:10px;color:var(--faint);border-bottom:1px solid var(--line)}
.ledger-row{padding:19px 12px;border-bottom:1px solid var(--line)}
.ledger-row:last-child{border-bottom:0}
.ledger-row .identity{gap:10px}
.ledger-row .identity .name{font-size:13px}
.ledger-row .btn{font-size:11px;padding:5px 8px;min-height:30px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint);margin-bottom:21px}
.breadcrumb button{font-size:11px;color:var(--muted);padding:0;display:flex;align-items:center;gap:5px}
.breadcrumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.full-detail{max-width:650px;margin:0 auto}
.full-detail .detail-title{margin-bottom:3px}

/* Dialogs only for discovery, auth and review. Sorting stays in the page. */
dialog{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 50px);border:1px solid var(--line);padding:0;border-radius:20px;background:var(--bg);color:var(--ink);box-shadow:0 24px 80px #0004;overflow:hidden}
dialog::backdrop{background:#14171b55;backdrop-filter:blur(3px)}
.dialog-inner{display:flex;flex-direction:column;max-height:calc(100dvh - 54px)}
.dialog-header{padding:20px 22px 10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.dialog-header h2{font-size:17px;font-weight:600}
.dialog-body{padding:8px 22px 22px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.dialog-description{font-size:12px;color:var(--muted);line-height:1.75}
.dialog-footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:var(--subtle)}
.dialog-footer .count{margin-right:auto;color:var(--muted);font-size:12px;align-self:center}
.catalog-search{position:sticky;top:0;width:100%;z-index:1;background:var(--bg)}
.picker-group h3{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;color:var(--faint);margin:3px 0 8px}
.candidate{display:flex;gap:11px;align-items:flex-start;border:1px solid transparent;border-radius:8px;padding:10px;cursor:pointer}
.candidate:hover{background:var(--subtle)}
.candidate:has(input:checked){background:var(--subtle);border-color:var(--line)}
.candidate input{margin-top:4px}
.candidate-name{font-size:13px;font-weight:500}
.candidate-id{font-size:10px;color:var(--faint);margin-top:2px;overflow-wrap:anywhere}
.candidate-hint{font-size:11px;color:var(--muted);margin-top:4px}
.provider-cell{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.sort-row .provider-cell{padding-left:52px}
.sort-row .provider-cell .grip{position:absolute;left:0;top:50%;transform:translateY(-50%)}
.ledger-row.sort-row,.ledger:has(.sort-list) .ledger-labels{grid-template-columns:minmax(0,1fr) var(--quota-column)}
.ledger-row.sort-row>[data-action=open-provider],.ledger:has(.sort-list) .ledger-labels>span:last-child{display:none}
.provider-cell .identity{flex:1;min-width:0}
.overview-filters{flex-wrap:wrap}
[data-system-zone]{overflow-wrap:anywhere}
