<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PROTOTYPE — compact Provider Usage</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #25272b;
      background: #f5f6f8;
      --sidebar: #f8f9fb;
      --border: #e2e4e8;
      --muted: #7c818a;
      --blue: #4b7cff;
      --amber: #c47b08;
      --red: #d94848;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; }
    html[data-device="mobile"] body { display: grid; place-items: center; background: #d8dbe1; }
    html[data-device="mobile"] .app {
      display: grid; grid-template-columns: 280px minmax(0,1fr); width: 390px; height: 844px;
      border: 10px solid #1c1f24; border-radius: 36px; overflow: hidden;
      box-shadow: 0 24px 60px rgb(0 0 0 / 22%);
    }
    html[data-device="mobile"] .sidebar {
      flex: none; width: 280px; min-width: 280px; border-right: .5px solid #dcdfe4; padding: 12px 10px 8px;
    }
    html[data-device="mobile"] .conversation { display: block; min-width: 0; }
    html[data-device="mobile"] .conversation::before { top: 18px; left: 12px; right: 12px; font-size: 12px; }
    html[data-device="mobile"] .note { width: auto; margin: 64px 12px 0; font-size: 11px; }
    html[data-device="mobile"] .minis { gap: 4px; }
    html[data-device="mobile"] .mini { height: 44px; padding: 5px 6px; }
    html[data-device="mobile"] .mini-name { font-size: 8.5px; }
    html[data-device="mobile"] .mini-value { font-size: 13px; }
    html[data-device="mobile"] .switcher { left: 50%; bottom: 12px; }
    button, input { font: inherit; color: inherit; }
    .app { display: flex; height: 100vh; }
    .sidebar {
      position: relative; display: flex; flex: 0 0 276px; flex-direction: column;
      width: 276px; min-width: 276px; height: 100%; padding: 14px 12px 8px;
      overflow: hidden; border-right: 1px solid #dcdfe4; background: var(--sidebar);
    }
    .brand-row { display: flex; align-items: center; height: 48px; padding: 0 2px; }
    .brand-mark { width: 23px; height: 23px; margin-right: 8px; border-radius: 60% 45% 55% 42%; background: #17191c; transform: rotate(-8deg); }
    .brand { font-size: 19px; font-weight: 650; letter-spacing: -.4px; }
    .harness { margin-left: 5px; padding: 1px 4px; border-radius: 3px; color: white; background: #23252a; font-size: 9px; font-weight: 700; letter-spacing: .7px; }
    .collapse { margin-left: auto; border: 0; background: transparent; color: #60656d; font-size: 17px; }
    .new-session { height: 40px; margin: 8px 0 18px; border: 1px solid #d7d9dd; border-radius: 9px; background: white; font-size: 14px; }
    .section-head { display: flex; align-items: center; height: 30px; color: #8a8e96; font-size: 13px; }
    .section-actions { display: flex; gap: 11px; margin-left: auto; color: #545962; font-size: 15px; }
    .session-region { flex: 1 1 auto; min-height: 150px; overflow: auto; scrollbar-width: thin; }
    .sessions { display: flex; flex-direction: column; gap: 1px; padding-bottom: 8px; }
    .session { display: flex; align-items: center; min-height: 31px; padding: 0 8px; border-radius: 7px; font-size: 13.5px; }
    .session.selected { background: #e8eaee; }
    .session-dot { width: 6px; height: 6px; margin-right: 9px; border-radius: 50%; background: #d2d6dc; }
    .session-dot.live { background: #2bce73; }
    .session-dot.wait { background: #ffae24; }
    .session-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-time { margin-left: auto; padding-left: 8px; color: #8b9098; font-size: 12px; }
    .usage-panel { flex: none; margin: 4px 0 6px; }
    .usage-head { display: flex; align-items: center; height: 24px; padding: 0 2px 4px; }
    .usage-title { font-size: 12px; font-weight: 680; }
    .usage-count { margin-left: 6px; color: var(--muted); font-size: 10px; }
    .usage-actions { display: flex; gap: 2px; margin-left: auto; }
    .icon-btn { display: grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: #686d75; cursor: pointer; }
    .icon-btn:hover { background: #eef0f3; }
    .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .icon-btn.spinning svg { animation: spin .55s ease; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .usage-scroll { overflow: visible; }
    .provider-icon { display: grid; place-items: center; flex: none; width: 16px; height: 16px; border-radius: 5px; color: white; background: var(--provider); font-size: 8px; font-weight: 750; }
    .active { outline: 1px solid var(--blue); }
    .low { color: var(--red); }
    .warn { color: var(--amber); }
    .empty-text { color: var(--muted); font-weight: 550; }

    /* A: two-column dense digest — 3 rows, no meters */
    .digest { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: #eceef1; }
    .digest-cell { display: flex; align-items: center; gap: 6px; min-width: 0; height: 30px; padding: 0 7px; border: 0; background: #fff; cursor: pointer; text-align: left; }
    .digest-cell:hover { background: #f7f8fa; }
    .digest-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 620; }
    .digest-value { margin-left: auto; font-size: 12px; font-weight: 720; font-variant-numeric: tabular-nums; }

    /* B: three-column initials — 2 rows */
    .minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
    .mini { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; height: 44px; padding: 6px 7px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; text-align: left; }
    .mini:hover { border-color: #c5cad3; }
    .mini-top { display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; }
    .mini-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 9px; }
    .mini-value { font-size: 13px; font-weight: 730; font-variant-numeric: tabular-nums; line-height: 1; }

    /* C: wrapping pills — two lines max */
    .pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill { display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px 0 5px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; }
    .pill:hover { border-color: #c5cad3; }
    .pill b { font-size: 11px; font-weight: 720; font-variant-numeric: tabular-nums; }
    .pill small { color: var(--muted); font-size: 10px; }

    .settings-row { display: flex; align-items: center; flex: none; height: 40px; padding: 0 8px; border-radius: 8px; font-size: 14px; }
    .settings-row span:first-child { margin-right: 9px; font-size: 17px; }
    .visibility-popover {
      position: absolute; z-index: 20; right: 10px; bottom: 50px; left: 10px;
      overflow: hidden; border: 1px solid #d7dae0; border-radius: 12px; background: white;
      box-shadow: 0 14px 40px rgb(24 28 36 / 18%);
    }
    .popover-head { display: flex; align-items: center; padding: 12px 12px 8px; }
    .popover-title { font-size: 13px; font-weight: 700; }
    .popover-sub { margin-top: 2px; color: var(--muted); font-size: 10.5px; }
    .popover-close { margin-left: auto; }
    .filter-search { width: calc(100% - 20px); height: 30px; margin: 0 10px 6px; padding: 0 9px; border: 1px solid #dfe2e7; border-radius: 7px; outline: none; }
    .filter-list { max-height: 280px; overflow: auto; padding: 2px 8px 8px; }
    .filter-item { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 5px; border-radius: 7px; font-size: 12px; }
    .filter-item:hover { background: #f3f4f6; }
    .filter-all { border-bottom: 1px solid #eceef1; font-weight: 650; }
    .empty { padding: 14px 8px; color: var(--muted); text-align: center; font-size: 11px; }
    .conversation { position: relative; flex: 1; min-width: 0; background: #fff; }
    .conversation::before { content: "Question: how compact can Provider Usage be without stealing Sessions height?"; position: absolute; top: 28px; left: 28px; right: 28px; color: #8b9098; font-size: 14px; }
    .conversation::after { content: "Prototype only — no live Provider RPCs"; position: absolute; right: 24px; bottom: 24px; color: #c5c8cd; font-size: 11px; }
    .note { width: min(560px, 78%); margin: 88px auto 0; color: #5b616a; font-size: 13px; line-height: 1.55; }
    .note code { padding: 0 4px; border-radius: 4px; background: #f1f2f4; font-size: 12px; }
    .switcher {
      position: fixed; z-index: 1000; bottom: 16px; left: calc(276px + (100vw - 276px) / 2); display: flex; align-items: center; gap: 7px;
      padding: 7px 9px; border: 1px solid #242933; border-radius: 999px; color: white; background: #16191f;
      box-shadow: 0 8px 30px rgb(0 0 0 / 25%); transform: translateX(-50%); font-size: 12px;
    }
    .switcher a { display: inline-grid; place-items: center; height: 27px; border-radius: 999px; color: white; background: #2a303a; text-decoration: none; }
    .switcher .arrow { width: 27px; }
    .switcher .label { min-width: 168px; padding: 0 10px; background: #3a4351; }
    .scenario { display: flex; gap: 2px; }
    .scenario a { min-width: 58px; padding: 0 8px; }
    .scenario a.active { background: #597ff4; }
    .state { color: #aeb5c0; white-space: nowrap; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      .conversation { display: none; }
      .sidebar { flex-basis: 100%; width: 100%; min-width: 0; border-right: 0; }
      .switcher { bottom: 8px; left: 50%; }
      .digest { grid-template-columns: 1fr; }
      .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <!-- PROTOTYPE: three compact Provider Usage layouts, switchable via ?variant=. Question: cut vertical height. -->
  <main class="app">
    <aside class="sidebar">
      <header class="brand-row"><span class="brand-mark"></span><span class="brand">deepseek</span><span class="harness">HARNESS</span><button class="collapse" aria-label="折叠侧栏">◧</button></header>
      <button class="new-session">⊕&nbsp; New Session</button>
      <div class="section-head"><span>Sessions</span><span class="section-actions"><span>⌕</span><span>☷</span><span>⊞</span></span></div>
      <section class="session-region" aria-label="Sessions"><div class="sessions" id="sessions"></div></section>
      <section class="usage-panel" id="usagePanel" aria-label="Provider usage prototype">
        <div class="usage-head">
          <span class="usage-title">Provider Usage</span><span class="usage-count" id="usageCount"></span>
          <span class="usage-actions">
            <button class="icon-btn" id="visibilityButton" aria-label="选择侧栏显示的 Provider"><svg viewBox="0 0 20 20"><path d="M3 5h8M15 5h2M9 10h8M3 10h2M3 15h6M13 15h4"/><circle cx="13" cy="5" r="2"/><circle cx="7" cy="10" r="2"/><circle cx="11" cy="15" r="2"/></svg></button>
            <button class="icon-btn" id="refreshButton" aria-label="刷新用量"><svg viewBox="0 0 20 20"><path d="M16.2 7A6.5 6.5 0 1 0 16 13.5"/><path d="M16.2 3.8V7H13"/></svg></button>
          </span>
        </div>
        <div class="usage-scroll" id="usage"></div>
      </section>
      <div class="settings-row"><span>⚙</span><span>Settings</span></div>
      <section class="visibility-popover" id="visibilityPopover" hidden>
        <div class="popover-head"><div><div class="popover-title">侧栏显示</div><div class="popover-sub">只影响 Provider Usage</div></div><button class="icon-btn popover-close" id="popoverClose">×</button></div>
        <input class="filter-search" id="providerSearch" type="search" placeholder="搜索 Provider">
        <div class="filter-list" id="providerFilter"></div>
      </section>
    </aside>
    <section class="conversation" aria-hidden="true">
      <div class="note">
        已选定 <b>B 三列微格</b>。Phone 按真实布局：390 视口里侧栏仍是 280px 叠加层，不是全宽。<br>
        空数据仍是 —，次窗口只放 title。
      </div>
    </section>
  </main>
  <nav class="switcher" aria-label="Prototype variants">
    <a class="arrow" id="previous">←</a>
    <a class="label" id="variantLabel"></a>
    <a class="arrow" id="next">→</a>
    <span class="scenario">
      <a id="deviceDesktop" data-device="desktop">Desktop</a>
      <a id="deviceMobile" data-device="mobile">Phone</a>
    </span>
    <span class="state" id="state"></span>
  </nav>
  <script>
    const variants = [
      { key: 'A', name: '双列密排' },
      { key: 'B', name: '三列微格' },
      { key: 'C', name: '胶囊流' },
    ]
    const rank = label => ({ M:6, Month:6, W:5, Week:5, D:4, Day:4, Curs:3, S:1, Session:1, A:0, Agent:0 }[label] ?? (/^\d+h$/i.test(label) ? 2 : 0))
    const allProviders = [
      { key:'cursor', name:'Cursor', color:'#30343b', monogram:'C', windows:[{label:'Curs', remaining:62.7},{label:'Oth', remaining:0}] },
      { key:'grok', name:'Grok', color:'#111827', monogram:'G', windows:[{label:'W', remaining:60}] },
      { key:'codex', name:'Codex', color:'#15171b', monogram:'C', windows:[] },
      { key:'ollama', name:'Ollama Cloud', color:'#e87935', monogram:'O', windows:[{label:'W', remaining:74.2},{label:'S', remaining:100}] },
      { key:'commandcode', name:'CommandCode', color:'#6d5ce7', monogram:'C', windows:[] },
      { key:'opencode', name:'OpenCode Go', color:'#16846f', monogram:'O', windows:[{label:'M', remaining:66},{label:'S', remaining:100},{label:'W', remaining:33}] },
    ]
    const sessionNames = ['Codex Host 架构与 DSH 插件讨论','设计对话界面的 Provider 用量','核查 DSH Ponytail Skill 注入机制','讨论 DSH 看板插件方案','Codex App 自动更新方法','你看下，我们现在 3080 上安装','修复侧边栏链接打开与点击失效','Codebase Design','你检查下我们的 fast 模式设置','排查 3080 卡顿与模型切换问题']
    const params = new URLSearchParams(location.search)
    let variant = variants.some(v => v.key === params.get('variant')) ? params.get('variant') : 'B'
    let device = params.get('device') === 'mobile' ? 'mobile' : 'desktop'
    document.documentElement.dataset.device = device
    let visible = new Set(allProviders.map(p => p.key))
    let active = 'cursor'
    let filter = ''
    const shown = () => allProviders.filter(p => visible.has(p.key))
    const primary = provider => provider.windows.reduce((best, item) => best === undefined || rank(item.label) > rank(best.label) ? item : best, undefined)
    const valueOf = provider => { const p = primary(provider); return p ? (Number.isInteger(p.remaining) ? p.remaining + '%' : String(p.remaining) + '%') : '—' }
    const tone = provider => { const p = primary(provider); if (!p) return 'empty-text'; return p.remaining <= 15 ? 'low' : p.remaining <= 35 ? 'warn' : '' }
    const titleOf = provider => provider.windows.length ? provider.windows.map(w => w.label + ' ' + w.remaining + '%').join(' · ') : '暂无额度数据'
    const icon = provider => '<span class="provider-icon" style="--provider:'+provider.color+'">'+provider.monogram+'</span>'

    function renderSessions() {
      document.querySelector('#sessions').innerHTML = sessionNames.map((name,index) => '<div class="session '+(index===1?'selected':'')+'"><i class="session-dot '+(index===0?'live':index===1?'wait':'')+'"></i><span class="session-title">'+name+'</span><span class="session-time">'+(['3min','7min','9min','1h','1h','6h','7h','2d','3d','3d'][index])+'</span></div>').join('')
    }
    function cell(provider, cls, body) {
      return '<button type="button" class="'+cls+(provider.key===active?' active':'')+'" data-provider="'+provider.key+'" title="'+titleOf(provider)+'" aria-label="'+provider.name+' '+valueOf(provider)+'">'+body+'</button>'
    }
    function renderA(items) {
      return '<div class="digest">'+items.map(p => cell(p,'digest-cell', icon(p)+'<span class="digest-name">'+p.name+'</span><b class="digest-value '+tone(p)+'">'+valueOf(p)+'</b>')).join('')+'</div>'
    }
    function renderB(items) {
      return '<div class="minis">'+items.map(p => cell(p,'mini', '<span class="mini-top">'+icon(p)+'<span class="mini-name">'+p.name+'</span></span><b class="mini-value '+tone(p)+'">'+valueOf(p)+'</b>')).join('')+'</div>'
    }
    function renderC(items) {
      return '<div class="pills">'+items.map(p => cell(p,'pill', icon(p)+'<small>'+p.name.split(' ')[0]+'</small><b class="'+tone(p)+'">'+valueOf(p)+'</b>')).join('')+'</div>'
    }
    function renderUsage() {
      const items = shown()
      document.querySelector('#usage').innerHTML = items.length === 0 ? '<div class="empty">没有显示的 Provider</div>' : variant==='A' ? renderA(items) : variant==='B' ? renderB(items) : renderC(items)
      document.querySelector('#usageCount').textContent = items.length+' / '+allProviders.length
      document.querySelectorAll('[data-provider]').forEach(el => el.addEventListener('click', () => { active=el.dataset.provider; renderUsage(); renderSwitcher() }))
      renderSwitcher()
    }
    function renderFilter() {
      const items = allProviders.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()))
      const allChecked = allProviders.every(p => visible.has(p.key))
      document.querySelector('#providerFilter').innerHTML = '<label class="filter-item filter-all"><input id="toggleAll" type="checkbox" '+(allChecked?'checked':'')+'>显示全部</label>'+items.map(p => '<label class="filter-item"><input type="checkbox" data-visible="'+p.key+'" '+(visible.has(p.key)?'checked':'')+'>'+icon(p)+'<span>'+p.name+'</span></label>').join('')
      document.querySelector('#toggleAll').addEventListener('change', event => { visible = event.target.checked ? new Set(allProviders.map(p=>p.key)) : new Set(); renderFilter(); renderUsage() })
      document.querySelectorAll('[data-visible]').forEach(input => input.addEventListener('change', () => { input.checked ? visible.add(input.dataset.visible) : visible.delete(input.dataset.visible); renderFilter(); renderUsage() }))
    }
    function renderSwitcher() {
      const meta = variants.find(v => v.key === variant)
      const height = Math.round(document.querySelector('#usagePanel').getBoundingClientRect().height)
      document.querySelector('#variantLabel').textContent = meta.key+' · '+meta.name
      document.querySelector('#state').textContent = height+'px'
      const index = variants.findIndex(v => v.key === variant)
      const href = (nextVariant, nextDevice) => '?variant='+nextVariant+'&device='+nextDevice
      document.querySelector('#previous').href = href(variants[(index-1+variants.length)%variants.length].key, device)
      document.querySelector('#next').href = href(variants[(index+1)%variants.length].key, device)
      document.querySelector('#variantLabel').href = document.querySelector('#next').href
      document.querySelectorAll('.scenario [data-device]').forEach(link => {
        link.classList.toggle('active', link.dataset.device === device)
        link.href = href(variant, link.dataset.device)
      })
    }
    function cycle(delta) {
      const index = variants.findIndex(v => v.key === variant)
      location.href = '?variant='+variants[(index+delta+variants.length)%variants.length].key+'&device='+device
    }
    document.querySelector('#visibilityButton').addEventListener('click', () => { const pop=document.querySelector('#visibilityPopover'); pop.hidden=!pop.hidden; if (!pop.hidden) { renderFilter(); document.querySelector('#providerSearch').focus() } })
    document.querySelector('#popoverClose').addEventListener('click', () => { document.querySelector('#visibilityPopover').hidden = true })
    document.querySelector('#providerSearch').addEventListener('input', event => { filter=event.target.value; renderFilter() })
    document.querySelector('#refreshButton').addEventListener('click', event => { event.currentTarget.classList.add('spinning'); setTimeout(() => event.currentTarget.classList.remove('spinning'), 500) })
    document.addEventListener('keydown', event => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return; if (event.key==='ArrowLeft') cycle(-1); if (event.key==='ArrowRight') cycle(1); if (event.key==='Escape') document.querySelector('#visibilityPopover').hidden = true })
    renderSessions(); renderUsage(); renderFilter()
  </script>
</body>
</html>
