function mini(p){if(p.status!=='已连接'||!p.quotas?.length)return '<div class="compact">'+(p.status==='已连接'?'额度未提供':'')+'</div>';const q=p.quotas[0];return '<div class="compact"><div class="meterlabel"><span>'+q[0]+'</span><b>'+q[1]+'% <small>剩余</small></b></div>'+meter(q)+'</div>'}
function meter(q){return '<div class="meter '+(q[1]<20?'low':'')+'" role="meter" aria-label="'+q[0]+'剩余额度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+q[1]+'"><i style="width:'+q[1]+'%"></i><span></span></div>'}
function sortList(scope){let ids=scope==='providers'?providerOrder:modelOrder[scope];return '<p class="sortHint">拖动手柄调整顺序，也可使用上下按钮。</p><div class="sortlist">'+ids.map((id,i)=>'<div class="sortrow" data-scope="'+scope+'" data-sort-id="'+id+'"><button class="grip" data-grip="true" aria-label="拖动排序；方向键调整" title="拖动排序；方向键调整">⠿</button><div class="sortname">'+(scope==='providers'?identity(providers.find(p=>p.id===id),false):providers.find(p=>p.id===scope).models[Number(id)])+'</div><button data-action="move" data-scope="'+scope+'" data-id="'+id+'" data-offset="-1" aria-label="上移" '+(i===0?'disabled':'')+'>↑</button><button data-action="move" data-scope="'+scope+'" data-id="'+id+'" data-offset="1" aria-label="下移" '+(i===ids.length-1?'disabled':'')+'>↓</button></div>').join('')+'</div>'}
function moveItem(scope,id,offset){let ids=scope==='providers'?providerOrder:modelOrder[scope],from=ids.indexOf(id),to=from+offset;if(from<0||to<0||to>=ids.length)return;ids.splice(to,0,ids.splice(from,1)[0]);if(scope!=='providers')dirty=true;last='调整 '+scope+' 顺序';render()}
let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-grip]');if(!h)return;const row=h.closest('.sortrow');drag={scope:row.dataset.scope,id:row.dataset.sortId,target:row.dataset.sortId};h.setPointerCapture(e.pointerId);row.classList.add('dragging');e.preventDefault()});
// ponytail: drop-only prototype sorting; production reuses shared SortableList live preview and auto-scroll.
document.addEventListener('pointermove',e=>{if(!drag)return;const row=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sortrow');document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));if(row&&row.dataset.scope===drag.scope){drag.target=row.dataset.sortId;row.classList.add('dropTarget')}});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;const ids=d.scope==='providers'?providerOrder:modelOrder[d.scope];moveItem(d.scope,d.id,ids.indexOf(d.target)-ids.indexOf(d.id));render()});
document.addEventListener('pointercancel',()=>{drag=null;render()});
document.addEventListener('keydown',e=>{const h=e.target.closest('[data-grip]');if(!h||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const row=h.closest('.sortrow'),scope=row.dataset.scope,id=row.dataset.sortId;moveItem(scope,id,e.key==='ArrowUp'?-1:1);document.querySelector('[data-scope="'+scope+'"][data-sort-id="'+id+'"] [data-grip]').focus()});
function render(){document.querySelector('#app').innerHTML='<header><h1>Providers</h1><p>模型提供商与 Agent 运行时</p></header>'+VariantA()+'<details class="statePanel"><summary>原型状态 · 演示数据</summary><pre></pre></details>';document.querySelector('pre').textContent=JSON.stringify({selected,opened,dirty,enabled,prefs,modelOrder,providerOrder,last},null,2)}
function toast(text){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2200)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;last=a;if(a==='provider-sort'){providerSort=!providerSort;query='';opened=null}if(a==='model-sort')modelSort=modelSort===id?null:id;if(a==='model-settings'){let key=id+':'+b.dataset.index;expandedModel=expandedModel===key?null:key}if(a==='move'){moveItem(b.dataset.scope,id,Number(b.dataset.offset));return}if(a==='theme'){document.body.classList.toggle('dark');let u=new URL(location.href);u.searchParams.set('theme',document.body.classList.contains('dark')?'dark':'light');history.replaceState(null,'',u);return}if(a==='open'){opened=opened===id?null:id;selected=id}if(a==='auth'){let p=providers.find(p=>p.id===id);p.status=p.status==='已连接'?'未连接':'已连接';toast('演示：'+p.status)}if(a==='refresh')toast('演示数据已刷新，未请求 API');if(a==='catalog')toast('演示：更新模型目录');if(a==='routing')toast('正式界面将打开 Model Switch');if(a==='save'){saved=snapshot();dirty=false;toast('已保存在原型内存中')}if(a==='cancel'){Object.assign(enabled,structuredClone(saved.enabled));Object.assign(prefs,structuredClone(saved.prefs));Object.assign(modelOrder,structuredClone(saved.modelOrder));dirty=false}render()});
document.addEventListener('change',e=>{if(e.target.dataset.pref){const t=e.target,v=prefs[t.dataset.provider][Number(t.dataset.index)],key=t.dataset.pref;v[key]=key==='thinking'||key==='vision'?t.checked:key==='context'?t.value.replace(/[^0-9]/g,''):t.value;if(key==='thinking'&&!v.thinking)v.effort='auto';dirty=true;render();return}if(e.target.dataset.model!==undefined){enabled[e.target.dataset.provider][Number(e.target.dataset.model)]=e.target.checked;dirty=true;render()}if(e.target.hasAttribute('data-advanced')){dirty=true;render()}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){let pos=e.target.selectionStart;query=e.target.value;render();let n=document.querySelector('#filter');n.focus();n.setSelectionRange(pos,pos)}});render();
</script></body></html>
