<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Providers · A 原型</title><link rel="icon" href="data:,">
<style>
/* Throwaway selected-A prototype: ordinary settings rows, no decorative role accents. */
*{box-sizing:border-box} :root{--surface:#fff;--soft:#f5f6f7;--text:#25272b;--muted:#696d75;--line:#e8e9ec;--accent:#4d6bfe;--warn:#9a5c18;--good:#28775b}body{margin:0;background:#f1f2f4;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}body.dark{color-scheme:dark;--surface:#202126;--soft:#282a2f;--text:#e7e9ed;--muted:#a6abb5;--line:#36383f;--accent:#a4b5ff;--warn:#e2b277;--good:#86c8ae;background:#17181c}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:6px 11px;background:var(--surface)}button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.primary{background:var(--text);border-color:var(--text);color:var(--surface)}button.link{border:0;color:var(--accent);padding:5px 0;background:none}h1{font-size:20px;line-height:1.4;font-weight:600;margin:0 0 6px;letter-spacing:0}h3{font-size:13px;font-weight:600;margin:0}p{margin:0;color:var(--muted)}small,.subtle{font-size:12px;color:var(--muted)}.shell{max-width:1120px;min-height:760px;margin:28px auto 90px;display:grid;grid-template-columns:176px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}.nav{background:var(--soft);border-right:1px solid var(--line);padding:24px 12px}.nav h2{font-size:15px;margin:0 12px 26px}.nav div{padding:9px 12px;margin:2px 0;color:var(--muted);border-radius:5px}.nav .active{background:var(--line);color:var(--text);font-weight:500}.nav small{display:block;margin:32px 12px;font-size:11px}main{padding:30px 32px;min-width:0}header{margin-bottom:24px}header p{font-size:12px}.toolbar{margin-bottom:14px}.toolbar input{width:230px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12px}.card,.card.agent-card{margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;box-shadow:none;overflow:visible}.cardHeader{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:14px 0;text-align:left;background:none;border:0;border-radius:0}.cardHeader:hover{background:var(--soft)}.identity{display:flex;align-items:center;gap:12px;min-width:0;flex:1}.identity>div{min-width:0}.identity strong{font-size:14px;font-weight:550}.identity small{display:block;margin-top:3px;font-size:11px}.mark{display:grid;place-items:center;width:28px;height:28px;flex-shrink:0;font-weight:650;font-size:14px;background:none;border:0}.mark svg{width:26px;height:26px}.badge{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-left:6px;font-size:10px;line-height:16px;padding:0 5px;border-radius:3px;font-weight:500;white-space:nowrap}.badge svg{width:12px;height:12px}.badge-llm{color:var(--muted);border:1px solid var(--line);background:transparent}.badge-agent{color:var(--surface);background:var(--text);border:1px solid var(--text)}.compact{font-size:11px;color:var(--muted);width:172px;text-align:right;font-variant-numeric:tabular-nums}.state{font-size:11px;color:var(--muted);width:96px;text-align:right;white-space:nowrap}.state.warn{color:var(--warn)}.state.off{color:var(--muted)}.dot{display:none}.chevron{display:block;width:15px;color:var(--muted);font-size:20px;font-weight:400;text-align:center}.body{padding:0 0 20px 40px}.section{padding:19px 0;border-top:1px solid var(--line)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.row{display:flex;align-items:center;gap:14px}.grow{flex:1}.row p{font-size:12px}.row button{white-space:nowrap}.row .subtle{font-size:11px}.quotaGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}.quota{background:none;padding:0;border:0;border-radius:0}.quota .row{justify-content:space-between;gap:8px;font-size:12px}.quota b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.quota b small{margin-left:3px;font-size:10px;font-weight:400}.quota small{font-size:11px}.track{height:3px;margin:9px 0 5px;background:var(--line);border-radius:0}.track i{display:block;height:100%;background:var(--muted)}.track i.low{background:var(--warn)}.notice{font-size:12px;color:var(--muted);line-height:1.8}.models{margin-top:8px}.model{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.model:last-child{border:0}.model span{flex:1}.model small{font-size:10px}.model input{accent-color:var(--text)}.capabilities{display:flex;gap:14px;margin-top:10px;color:var(--muted);font-size:12px}.pill{padding:0;border:0;background:none}.foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:16px;border-top:1px solid var(--line);margin-top:16px}.foot small{margin-right:auto;font-size:11px}details{margin-top:12px}summary{font-size:12px;color:var(--muted);cursor:pointer}details label{display:block;margin-top:10px;font-size:12px}details input{display:block;width:100%;margin-top:7px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px}details p{font-size:11px;margin-top:8px}.statePanel{margin-top:28px;font-size:11px}.statePanel pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:var(--muted)}.preview{position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:12px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--muted);z-index:5}.preview button{font-size:11px}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;padding:10px 15px;background:var(--text);color:var(--surface);border-radius:5px;z-index:6;font-size:12px}
@media(max-width:980px){.shell{margin:12px 12px 80px;grid-template-columns:150px minmax(0,1fr)}main{padding:24px}.compact{width:120px}.cardHeader{gap:9px}}
@media(max-width:680px){.shell{display:block;margin:0 0 80px;border:0;border-radius:0;min-height:100vh}.nav{display:flex;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px;background:var(--surface);height:52px}.nav h2{font-size:13px;margin:0}.nav div:not(.active),.nav small{display:none}.nav .active{background:none;padding:0;font-size:12px;color:var(--muted);font-weight:400}.nav .active:before{content:'/';margin-right:10px}main{padding:22px 20px}header{margin-bottom:18px}.toolbar input{width:100%;min-height:44px}.cardHeader{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 9px;padding:17px 0;min-height:106px}.identity{grid-column:1;grid-row:1;gap:9px}.identity strong{font-size:13px}.identity small{font-size:11px}.identity .mark{width:25px;height:25px}.badge{margin-left:4px;font-size:9px}.badge svg{width:11px;height:11px}.chevron{grid-column:2;grid-row:1;width:18px}.compact{grid-column:1;grid-row:2;width:auto;text-align:left;padding-left:34px;font-size:10px}.state{grid-column:2;grid-row:2;width:auto;font-size:10px}.body{padding:0 0 18px}.quotaGrid{grid-template-columns:1fr;gap:18px}.section .row{flex-wrap:wrap}.section .row .grow{flex-basis:170px}.section .row button{margin-left:auto}.model{min-height:48px}.model input{width:17px;height:17px}.foot{flex-wrap:wrap;background:var(--surface)}.foot small{flex-basis:100%;font-size:11px}.foot button{flex:1}button{min-height:44px}.sectiontitle .link{min-height:44px}.preview{bottom:calc(10px + env(safe-area-inset-bottom));right:12px;padding:3px 8px}.preview button{border:0;min-height:40px}.statePanel{margin-bottom:20px}}
</style><body><div class="shell"><aside class="nav"><h2>Settings</h2><div>常规</div><div>Model Switch</div><div class="active">Providers</div><div>模型</div><div>插件</div><div>Agent 预设</div><small>Settings 外壳为原型仿制</small></aside><main id="app"></main></div><aside class="preview">原型 · 演示数据<button data-action="theme">切换深浅色</button></aside><script>
// THROWAWAY: selected accordion design; no real accounts, API calls or persistence.
const providers=[
{id:'codex',name:'Codex',mark:'C',role:'LLM',status:'已连接',caps:['对话','搜索','图像'],models:['GPT · 标准','GPT · 快速','GPT · 深度推理'],quotas:[['5 小时',76,'约 2 小时后重置'],['每周',58,'周五重置']]},
{id:'agy',name:'Antigravity',mark:'A',role:'Agent',status:'已连接',caps:['原生 Agent'],models:['Gemini · Pro','Gemini · Flash','Claude · Thinking'],quotas:[['Gemini · 5 小时',84,'约 3 小时后重置'],['Gemini · 每周',63,'周四重置'],['Claude / GPT · 5 小时',92,'约 3 小时后重置'],['Claude / GPT · 每周',71,'周六重置']]},
{id:'grok',name:'Grok',mark:'G',role:'LLM',status:'需要重新登录',caps:['对话','搜索','图像'],models:['Grok · 标准','Grok · 推理'],quotas:[]},
{id:'deepseek',name:'DeepSeek',mark:'D',role:'LLM',status:'已连接',caps:['对话','搜索'],models:['DeepSeek · Chat','DeepSeek · Reasoner'],quotas:null},
{id:'cursor',name:'Cursor',mark:'Cu',role:'LLM',status:'已连接',caps:['对话'],models:['Auto','Composer'],quotas:[['本月',18,'月底重置']]},
{id:'ollama',name:'Ollama Cloud',mark:'O',role:'LLM',status:'未连接',caps:['对话'],models:['Cloud model'],quotas:[]},
{id:'command',name:'Command Code',mark:'Cc',role:'LLM',status:'已连接',caps:['对话'],models:['Default'],quotas:[['本月',64,'月底重置']]},
{id:'opencode',name:'OpenCode Go',mark:'Go',role:'LLM',status:'已连接',caps:['对话'],models:['默认模型'],quotas:[['每周',81,'周日重置']]}
];
let variant='A',selected='agy',opened=null,query='',last='初始状态',dirty=false,tab='账户';
const enabled=Object.fromEntries(providers.map(p=>[p.id,p.models.map(()=>true)]));let saved=structuredClone(enabled);
document.body.classList.toggle('dark',new URL(location.href).searchParams.get('theme')==='dark'||(!new URL(location.href).searchParams.has('theme')&&matchMedia('(prefers-color-scheme: dark)').matches));
function mark(p){return '<span class="mark" aria-hidden="true">'+(p.id==='agy'?'<svg viewBox="0 0 169 148" fill="currentColor"><path d="M84.5 16C64 16 57 39 49 67C42 93 36 111 24 122C18 128 22 132 28 132C42 132 50 116 59 99C66 85 72 78 84.5 78C97 78 103 85 110 99C119 116 127 132 141 132C147 132 151 128 145 122C133 111 127 93 120 67C112 39 105 16 84.5 16Z"/></svg>':p.mark)+'</span>'}
function status(p){return '<span class="state '+(p.status.includes('重新')?'warn':p.status==='未连接'?'off':'')+'"><i class="dot"></i>'+p.status+'</span>'}
function identity(p,sub=true){return '<div class="identity">'+mark(p)+'<div><strong>'+p.name+'</strong> <span class="badge '+(p.role==='Agent'?'badge-agent':'badge-llm')+'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">'+(p.role==='Agent'?'<rect x="1.5" y="2" width="13" height="12" rx="2"/><path d="m4 5 3 3-3 3m5 0h3"/>':'<rect x="2" y="2" width="12" height="9" rx="3"/><path d="m5 11-1 3 5-3M5 6h6"/>')+'</svg>'+p.role+'</span>'+(sub?'<small>'+enabled[p.id].filter(Boolean).length+' 个模型已启用</small>':'')+'</div></div>'}
function caps(p){return '<div class="capabilities">'+p.caps.map(c=>'<span class="pill">'+c+'</span>').join('')+'</div>'}
function quota(p){if(p.status!=='已连接')return '<div class="notice">连接账户后显示额度；不将缺失值显示为零。</div>';if(p.quotas===null)return '<div class="notice">此 Provider 未提供同类额度窗口。无数据不是 0%，也不代表无限额度。</div>';return '<div class="quotaGrid">'+p.quotas.map(q=>'<div class="quota"><div class="row"><span>'+q[0]+'</span><b>'+q[1]+'<small>% 剩余</small></b></div><div class="track"><i class="'+(q[1]<20?'low':'')+'" style="width:'+q[1]+'%"></i></div><small>'+q[2]+'</small></div>').join('')+'</div>'}
function auth(p){return '<section class="section"><div class="sectiontitle"><h3>账户连接</h3>'+status(p)+'</div><div class="row"><div class="grow"><p>'+ (p.status==='已连接'?'演示账户 · '+(p.id==='agy'?'Google OAuth / ACP':'Provider 原生认证'):'授权仅由 Provider 管理')+'</p><small class="subtle">'+(p.id==='agy'?'无需安装 CLI；运行时和认证相互隔离。':'此处管理连接，不改变默认模型路由。')+'</small></div><button data-action="auth" data-id="'+p.id+'">'+(p.status==='已连接'?'退出登录':p.status.includes('重新')?'重新登录':'连接账户')+'</button></div></section>'}
function quotaSection(p){return '<section class="section"><div class="sectiontitle"><h3>额度窗口</h3><button class="link" data-action="refresh">刷新 · 演示</button></div>'+quota(p)+'<p class="subtle" style="margin-top:9px">示例快照 · 非实时额度</p></section>'}
function models(p){return '<section class="section"><div class="sectiontitle"><h3>启用模型</h3><button class="link" data-action="catalog">更新目录</button></div><p class="subtle">决定哪些模型出现在选择器中，不设置默认模型。</p><div class="models">'+p.models.map((m,i)=>'<label class="model"><input type="checkbox" data-model="'+i+'" data-provider="'+p.id+'" '+(enabled[p.id][i]?'checked':'')+'><span>'+m+'</span><small>演示模型</small></label>').join('')+'</div></section>'}
function abilities(p){return '<section class="section"><h3>提供的能力</h3>'+caps(p)+'<p class="subtle" style="margin:12px 0">能力由 Provider 声明。搜索、图像和主模型的默认供应商统一在 Model Switch 选择。</p><button class="link" data-action="routing">前往 Model Switch ↗</button></section>'}
function advanced(p){return '<details><summary>高级设置'+(p.id==='agy'?' · ACP 运行时':'')+'</summary><label>'+(p.id==='agy'?'ACP 可执行文件路径':'请求超时（秒）')+'<input data-advanced value="'+(p.id==='agy'?'/example/runtime/agy_acp_server.par':'60')+'"></label><p class="subtle">仅用于体验表单层级，未连接任何真实配置。</p></details>'}
function footer(){return '<div class="foot"><small>'+ (dirty?'有未保存修改':'没有待保存修改')+'</small><button data-action="cancel" '+(!dirty?'disabled':'')+'>撤销</button><button class="primary" data-action="save" '+(!dirty?'disabled':'')+'>保存更改</button></div>'}
function detail(p,withTabs=false){return withTabs?'<div class="tabs" role="tablist" aria-label="Provider 配置">'+['账户','模型','能力'].map(t=>'<button role="tab" aria-selected="'+(tab===t)+'" class="'+(tab===t?'chosen':'')+'" data-action="tab" data-id="'+t+'">'+t+'</button>').join('')+'</div>'+ (tab==='账户'?auth(p)+quotaSection(p):tab==='模型'?models(p):abilities(p)+advanced(p))+footer():auth(p)+quotaSection(p)+models(p)+abilities(p)+advanced(p)+footer()}
function filtered(){return providers.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()))}
function VariantA(){return '<div class="toolbar"><input id="filter" aria-label="搜索 Provider" placeholder="搜索 Provider…" value="'+query.replace(/"/g,'&quot;')+'"></div>'+filtered().map(p=>'<article class="card '+(p.role==='Agent'?'agent-card ':'')+(opened===p.id?'open':'')+'"><button class="cardHeader" aria-expanded="'+(opened===p.id)+'" data-action="open" data-id="'+p.id+'">'+identity(p)+mini(p)+status(p)+'<span class="chevron">'+(opened===p.id?'⌄':'›')+'</span></button>'+(opened===p.id?'<div class="body">'+detail(p)+'</div>':'')+'</article>').join('')}
function mini(p){return '<div class="compact">'+(p.status==='已连接'?(p.quotas?.length?p.quotas[0][0]+' · '+p.quotas[0][1]+'% 剩余':'额度未提供'):'')+'</div>'}
function render(){document.querySelector('#app').innerHTML='<header><h1>Providers</h1><p>模型提供商与 Agent 运行时</p></header>'+VariantA()+'<details class="statePanel"><summary>原型状态 · 演示数据</summary><pre></pre></details>';document.querySelector('pre').textContent=JSON.stringify({selected,opened,dirty,enabled,last},null,2)}
function toast(text){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2200)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;last=a;if(a==='theme'){document.body.classList.toggle('dark');let u=new URL(location.href);u.searchParams.set('theme',document.body.classList.contains('dark')?'dark':'light');history.replaceState(null,'',u);return}if(a==='open'){opened=opened===id?null:id;selected=id}if(a==='auth'){let p=providers.find(p=>p.id===id);p.status=p.status==='已连接'?'未连接':'已连接';toast('演示：'+p.status)}if(a==='refresh')toast('演示数据已刷新，未请求 API');if(a==='catalog')toast('演示：更新模型目录');if(a==='routing')toast('正式界面将打开 Model Switch');if(a==='save'){saved=structuredClone(enabled);dirty=false;toast('已保存在原型内存中')}if(a==='cancel'){Object.assign(enabled,structuredClone(saved));dirty=false}render()});
document.addEventListener('change',e=>{if(e.target.dataset.model!==undefined){enabled[e.target.dataset.provider][Number(e.target.dataset.model)]=e.target.checked;dirty=true;render()}if(e.target.hasAttribute('data-advanced')){dirty=true;render()}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){let pos=e.target.selectionStart;query=e.target.value;render();let n=document.querySelector('#filter');n.focus();n.setSelectionRange(pos,pos)}});render();
</script></body></html>
