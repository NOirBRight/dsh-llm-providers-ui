{id:'cursor',name:'Cursor',mark:'Cu',role:'LLM',status:'已连接',caps:['对话'],models:['Auto','Composer'],quotas:[['本月',18,'月底重置']]},
{id:'ollama',name:'Ollama Cloud',mark:'O',role:'LLM',status:'未连接',caps:['对话'],models:['Cloud model'],quotas:[]},
{id:'command',name:'Command Code',mark:'Cc',role:'LLM',status:'已连接',caps:['对话'],models:['Default'],quotas:[['本月',64,'月底重置']]},
{id:'opencode',name:'OpenCode Go',mark:'Go',role:'LLM',status:'已连接',caps:['对话'],models:['默认模型'],quotas:[['每周',81,'周日重置']]}
];
let variant=new URL(location.href).searchParams.get('variant')||'A';if(!['A','C'].includes(variant))variant='A';
document.body.classList.toggle('dark',new URL(location.href).searchParams.get('theme')==='dark'||(!new URL(location.href).searchParams.has('theme')&&matchMedia('(prefers-color-scheme: dark)').matches));
let selected='agy',opened=null,tab='账户',drawer=false,query='',last='初始演示状态',dirty=false;
const enabled=Object.fromEntries(providers.map(p=>[p.id,p.models.map(()=>true)]));let saved=JSON.parse(JSON.stringify(enabled));
const names={A:'折叠清单',C:'任务式总览'};
const notes={A:'先扫状态，再原地展开。适合偶尔配置、低学习成本。',C:'先处理连接异常和额度，再进入侧面板。适合日常健康检查。'};
function mark(p){return '<span class="mark" aria-hidden="true">'+(p.id==='agy'?'<svg viewBox="0 0 169 148" fill="currentColor"><path d="M84.5 16C64 16 57 39 49 67C42 93 36 111 24 122C18 128 22 132 28 132C42 132 50 116 59 99C66 85 72 78 84.5 78C97 78 103 85 110 99C119 116 127 132 141 132C147 132 151 128 145 122C133 111 127 93 120 67C112 39 105 16 84.5 16Z"/></svg>':p.mark)+'</span>'}
function status(p){return '<span class="state '+(p.status.includes('重新')?'warn':p.status==='未连接'?'off':'')+'"><i class="dot"></i>'+p.status+'</span>'}
function identity(p,sub=true){return '<div class="identity">'+mark(p)+'<div><strong>'+p.name+'</strong> <span class="badge '+(p.role==='Agent'?'badge-agent':'badge-llm')+'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">'+(p.role==='Agent'?'<path d="m9 1-6 8h5l-1 6 6-8H8z"/>':'<rect x="2" y="2" width="12" height="9" rx="3"/><path d="m5 11-1 3 5-3M5 6h6"/>')+'</svg>'+p.role+'</span>'+(sub?'<small>'+enabled[p.id].filter(Boolean).length+' 个模型已启用</small>':'')+'</div></div>'}
function caps(p){return '<div class="capabilities">'+p.caps.map(c=>'<span class="pill">'+c+'</span>').join('')+'</div>'}
function quota(p){if(p.status!=='已连接')return '<div class="notice">连接账户后显示额度；不将缺失值显示为零。</div>';if(p.quotas===null)return '<div class="notice">此 Provider 未提供同类额度窗口。无数据不是 0%，也不代表无限额度。</div>';return '<div class="quotaGrid">'+p.quotas.map(q=>'<div class="quota"><div class="row"><span>'+q[0]+'</span><b>'+q[1]+'<small>% 剩余</small></b></div><div class="track"><i class="'+(q[1]<20?'low':'')+'" style="width:'+q[1]+'%"></i></div><small>'+q[2]+'</small></div>').join('')+'</div>'}
function auth(p){return '<section class="section"><div class="sectiontitle"><h3>账户连接</h3>'+status(p)+'</div><div class="row"><div class="grow"><p>'+ (p.status==='已连接'?'演示账户 · '+(p.id==='agy'?'Google OAuth / ACP':'Provider 原生认证'):'授权仅由 Provider 管理')+'</p><small class="subtle">'+(p.id==='agy'?'无需安装 CLI；运行时和认证相互隔离。':'此处管理连接，不改变默认模型路由。')+'</small></div><button data-action="auth" data-id="'+p.id+'">'+(p.status==='已连接'?'退出登录':p.status.includes('重新')?'重新登录':'连接账户')+'</button></div></section>'}
function quotaSection(p){return '<section class="section"><div class="sectiontitle"><h3>额度窗口</h3><button class="link" data-action="refresh">刷新 · 演示</button></div>'+quota(p)+'<p class="subtle" style="margin-top:9px">示例快照 · 非实时额度</p></section>'}
function models(p){return '<section class="section"><div class="sectiontitle"><h3>启用模型</h3><button class="link" data-action="catalog">更新目录</button></div><p class="subtle">决定哪些模型出现在选择器中，不设置默认模型。</p><div class="models">'+p.models.map((m,i)=>'<label class="model"><input type="checkbox" data-model="'+i+'" data-provider="'+p.id+'" '+(enabled[p.id][i]?'checked':'')+'><span>'+m+'</span><small>演示模型</small></label>').join('')+'</div></section>'}
function abilities(p){return '<section class="section"><h3>提供的能力</h3>'+caps(p)+'<p class="subtle" style="margin:12px 0">能力由 Provider 声明。搜索、图像和主模型的默认供应商统一在 Model Switch 选择。</p><button class="link" data-action="routing">前往 Model Switch ↗</button></section>'}
function advanced(p){return '<details><summary>高级设置'+(p.id==='agy'?' · ACP 运行时':'')+'</summary><label>'+(p.id==='agy'?'ACP 可执行文件路径':'请求超时（秒）')+'<input data-advanced value="'+(p.id==='agy'?'/example/runtime/agy_acp_server.par':'60')+'"></label><p class="subtle">仅用于体验表单层级，未连接任何真实配置。</p></details>'}
function footer(){return '<div class="foot"><small>'+ (dirty?'有未保存修改':'没有待保存修改')+'</small><button data-action="cancel" '+(!dirty?'disabled':'')+'>撤销</button><button class="primary" data-action="save" '+(!dirty?'disabled':'')+'>保存更改</button></div>'}
function detail(p,withTabs=false){return withTabs?'<div class="tabs" role="tablist" aria-label="Provider 配置">'+['账户','模型','能力'].map(t=>'<button role="tab" aria-selected="'+(tab===t)+'" class="'+(tab===t?'chosen':'')+'" data-action="tab" data-id="'+t+'">'+t+'</button>').join('')+'</div>'+ (tab==='账户'?auth(p)+quotaSection(p):tab==='模型'?models(p):abilities(p)+advanced(p))+footer():auth(p)+quotaSection(p)+models(p)+abilities(p)+advanced(p)+footer()}
function mini(p){if(p.status!=='已连接'||!p.quotas?.length)return '<div class="compact"><small>'+(p.status==='已连接'?'无额度窗口':'连接后可查看')+'</small></div>';let q=p.quotas[0];return '<div class="compact"><small>'+q[0]+' · 剩余 '+q[1]+'%</small><div class="track"><i style="width:'+q[1]+'%"></i></div></div>'}
function filtered(){return providers.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()))}
function VariantA(){return '<div class="toolbar"><input id="filter" aria-label="搜索 Provider" placeholder="搜索 Provider…" value="'+query.replace(/"/g,'&quot;')+'"><span>账户、模型和能力，集中管理</span></div>'+filtered().map(p=>'<article class="card '+(p.role==='Agent'?'agent-card ':'')+(opened===p.id?'open':'')+'"><button class="cardHeader" aria-expanded="'+(opened===p.id)+'" data-action="open" data-id="'+p.id+'">'+identity(p)+mini(p)+status(p)+'<span class="chevron">'+(opened===p.id?'−':'+')+'</span></button>'+(opened===p.id?'<div class="body">'+detail(p)+'</div>':'')+'</article>').join('')}
function VariantC(){let connected=providers.filter(p=>p.status==='已连接').length;return '<div class="metrics"><div class="metric"><small>已连接</small><strong>'+connected+' <span class="subtle">/ '+providers.length+'</span></strong></div><div class="metric"><small>需要处理</small><strong>'+providers.filter(p=>p.status.includes('重新')).length+'</strong></div><div class="metric"><small>已启用模型</small><strong>'+Object.values(enabled).flat().filter(Boolean).length+'</strong></div></div>'+providers.filter(p=>p.status.includes('重新')).map(p=>'<div class="task">'+mark(p)+'<div><strong>'+p.name+' 需要重新授权</strong><p>恢复连接后，模型和额度查询才可继续。</p></div><button data-action="manage" data-id="'+p.id+'">处理 →</button></div>').join('')+'<div class="sectiontitle" style="margin-top:24px"><h3>你的 Providers</h3><span class="subtle">按连接情况扫描，配置在侧面板完成</span></div><table class="portfolio"><thead><tr><th>Provider</th><th class="stateCell">连接状态</th><th class="capCell">能力</th><th>额度摘要</th><th><span class="subtle">操作</span></th></tr></thead><tbody>'+providers.map(p=>'<tr class="'+(p.role==='Agent'?'agent-card':'')+'"><td class="providerCell">'+identity(p)+'</td><td class="stateCell">'+status(p)+'</td><td class="capCell">'+p.caps.join(' · ')+'</td><td class="quotaCell" data-label="额度剩余">'+ (p.status!=='已连接'?'—':p.quotas?.length?p.quotas[0][1]+'%<br><small class="subtle">'+p.quotas[0][0]+' 剩余</small>':'未提供')+'</td><td class="actionCell"><button data-action="manage" data-id="'+p.id+'" aria-label="管理 '+p.name+'">管理</button></td></tr>').join('')+'</tbody></table>'}
function render(){document.querySelector('#app').innerHTML='<div class="head"><div><div class="eyebrow">Workspace / Connections</div><h1>模型与 Agent</h1><p>管理连接与可用能力。默认路由在 Model Switch 配置。</p></div><span class="prototypeTag">PROTOTYPE</span></div><div class="designNote"><b>'+variant+' / '+names[variant]+'</b><span>'+notes[variant]+'</span></div>'+({A:VariantA,C:VariantC}[variant])()+'<details class="statePanel"><summary>原型状态 · 所有数据和操作均为演示</summary><code>'+JSON.stringify({variant,selected,opened,tab,drawer,dirty,enabled,last},null,2)+'</code></details>';document.querySelectorAll('[data-action="variant"]').forEach(b=>{b.classList.toggle('current',b.dataset.id===variant);b.setAttribute('aria-pressed',String(b.dataset.id===variant))});document.querySelector('#overlay').innerHTML=drawer?'<div class="drawerShade"><section class="drawer" role="dialog" aria-modal="true" aria-label="Provider 设置"><div class="drawerTop"><span class="subtle">PROVIDER / 演示配置</span><button data-action="close" aria-label="关闭配置">关闭 ×</button></div>'+identity(providers.find(p=>p.id===selected))+'<div class="body">'+detail(providers.find(p=>p.id===selected),true)+'</div></section></div>':'';document.querySelector('.shell').inert=drawer;}
function toast(text){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}
function switchVariant(v){variant=v;drawer=false;let u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);last='切换至 '+names[v];render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;last=a+(id?' / '+id:'');if(a==='variant')return switchVariant(id);if(a==='prev'||a==='next')return switchVariant(['A','C'][(['A','C'].indexOf(variant)+1)%2]);if(a==='theme'){document.body.classList.toggle('dark');let u=new URL(location.href);u.searchParams.set('theme',document.body.classList.contains('dark')?'dark':'light');history.replaceState(null,'',u);return}if(a==='open'){opened=opened===id?null:id;selected=id}if(a==='select'){selected=id}if(a==='manage'){selected=id;drawer=true;tab='账户'}if(a==='close')drawer=false;if(a==='tab')tab=id;if(a==='auth'){let p=providers.find(p=>p.id===id);p.status=p.status==='已连接'?'未连接':'已连接';toast('已模拟'+p.status+'，没有执行真实认证')}if(a==='refresh')toast('演示快照已刷新；没有发送网络请求');if(a==='catalog')toast('目录演示：正式版本在这里获取 Provider 模型');if(a==='routing')toast('这里将打开 Model Switch；此原型不改变路由');if(a==='save'){saved=JSON.parse(JSON.stringify(enabled));dirty=false;toast('已保存到原型内存，刷新页面即恢复')}if(a==='cancel'){Object.assign(enabled,JSON.parse(JSON.stringify(saved)));dirty=false;toast('已撤销原型修改')}render();if(a==='manage')document.querySelector('[data-action="close"]').focus();if(a==='close')document.querySelector('[data-action="manage"][data-id="'+selected+'"]').focus()});
document.addEventListener('change',e=>{if(e.target.dataset.model!==undefined){enabled[e.target.dataset.provider][Number(e.target.dataset.model)]=e.target.checked;dirty=true;last='修改模型启用状态';render()}if(e.target.hasAttribute('data-advanced')){dirty=true;last='修改高级字段（演示）';render()}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){let pos=e.target.selectionStart;query=e.target.value;render();let n=document.querySelector('#filter');n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer=false;render();document.querySelector('[data-action="manage"][data-id="'+selected+'"]').focus();return}if(drawer&&e.key==='Tab'){let nodes=[...document.querySelectorAll('.drawer button:not(:disabled),.drawer input,.drawer summary')];let first=nodes[0],end=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();end.focus()}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus()}return}if(e.target.closest('input,textarea,select,[contenteditable="true"],[role="tablist"]')||drawer)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(['A','C'][(['A','C'].indexOf(variant)+1)%2])}});window.addEventListener('popstate',()=>{variant=new URL(location.href).searchParams.get('variant')||'A';if(!['A','C'].includes(variant))variant='A';render()});render();
</script></body></html>
